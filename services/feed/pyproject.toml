[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "railtrack-feed"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "stomp.py>=8.1.0",
    "pymongo>=4.7.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/feed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
